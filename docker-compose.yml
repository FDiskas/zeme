services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    restart: unless-stopped
    environment:
      PORT: "8787"
      DATABASE_URL: "${DATABASE_URL}"
      BIIP_BASE_URL: "${BIIP_BASE_URL:-https://boundaries.biip.lt}"
      DISABLE_PDF: "${DISABLE_PDF:-false}"
    volumes:
      # Persist SQLite database file (only used when DATABASE_URL is a file: path)
      - server-db:/app/apps/server/prisma
      # Persist generated PDF files
      - server-pdfs:/app/apps/server/generated/pdf
    healthcheck:
      disable: true

  reginfo:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      - server

volumes:
  server-db:
  server-pdfs:
